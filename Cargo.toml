[workspace]
resolver = "3"
members = ["entangler", "qcp"]

[profile.dev]
lto = true
codegen-units = 1
debug = 2
debug-assertions = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = true
lto = 'fat'
opt-level = 's'

[workspace.dependencies]
defmt = "1.0.1"
defmt-rtt = "1.0.0"
fixed = "1.23.1"
fixed-macro = "1.2"

cobs = { version = "0.3.0", default-features = false, features = ["alloc"] }
heapless = "0.7.17"
postcard = { version = "1.1.1", features = ["alloc", "heapless"], default-features = false }
serde = { version = "1.0.219", default-features = false }